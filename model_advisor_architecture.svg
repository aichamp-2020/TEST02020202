<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2E3A8C"/></marker><filter id="s"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity=".18"/></filter></defs>
<rect width="1600" height="1000" fill="#fff"/><text x="800" y="58" text-anchor="middle" font-family="Arial" font-size="34" font-weight="700" fill="#12193F">Model Advisor — Logical Architecture</text>
<text x="800" y="91" text-anchor="middle" font-family="Arial" font-size="17" fill="#5B6472">Natural-language workload → model ranking → PAYG/PTU business decision</text>
<g font-family="Arial" filter="url(#s)">
<rect x="80" y="155" width="300" height="200" rx="18" fill="#12193F"/><text x="230" y="195" text-anchor="middle" font-size="22" font-weight="700" fill="white">Experience Layer</text><text x="110" y="235" font-size="17" fill="white">• Streamlit: six decision tabs</text><text x="110" y="272" font-size="17" fill="white">• CLI: interactive / one-shot</text><text x="110" y="309" font-size="17" fill="white">• HTML reference application</text>
<rect x="495" y="135" width="610" height="250" rx="18" fill="#EAF4F7" stroke="#2E3A8C" stroke-width="3"/><text x="800" y="175" text-anchor="middle" font-size="22" font-weight="700" fill="#12193F">Application / Orchestration Layer</text><text x="530" y="218" font-size="17" fill="#1C2333">Workload + token parser</text><text x="810" y="218" font-size="17" fill="#1C2333">Use-case profiler</text><text x="530" y="258" font-size="17" fill="#1C2333">Recommendation presenter</text><text x="810" y="258" font-size="17" fill="#1C2333">Text + image cost analysis</text><text x="530" y="298" font-size="17" fill="#1C2333">Synchronized tab state</text><text x="810" y="298" font-size="17" fill="#1C2333">Decision cockpit + CSV</text><text x="530" y="338" font-size="17" fill="#1C2333">Validation and tooltips</text><text x="810" y="338" font-size="17" fill="#1C2333">Human-readable recommendation</text>
<rect x="1220" y="155" width="300" height="200" rx="18" fill="#C9A227"/><text x="1370" y="195" text-anchor="middle" font-size="22" font-weight="700" fill="#12193F">User Inputs</text><text x="1250" y="235" font-size="17" fill="#12193F">• Workload sentence</text><text x="1250" y="272" font-size="17" fill="#12193F">• PDF/page quantities</text><text x="1250" y="309" font-size="17" fill="#12193F">• PTUs + annual contract</text>
<rect x="150" y="490" width="380" height="280" rx="18" fill="#F3F6FD" stroke="#2E3A8C" stroke-width="3"/><text x="340" y="532" text-anchor="middle" font-size="22" font-weight="700" fill="#12193F">Core Decision Engine</text><text x="185" y="578" font-size="17" fill="#1C2333">1. Capability hard filters</text><text x="185" y="616" font-size="17" fill="#1C2333">2. Complexity/intelligence fit</text><text x="185" y="654" font-size="17" fill="#1C2333">3. Context and modality fit</text><text x="185" y="692" font-size="17" fill="#1C2333">4. Latency and throughput</text><text x="185" y="730" font-size="17" fill="#1C2333">5. Volume-weighted economics</text>
<rect x="610" y="490" width="380" height="280" rx="18" fill="#FFF7E4" stroke="#C9A227" stroke-width="3"/><text x="800" y="532" text-anchor="middle" font-size="22" font-weight="700" fill="#12193F">PTU / PAYG Engine</text><text x="645" y="578" font-size="17" fill="#1C2333">• PAYG token cost</text><text x="645" y="616" font-size="17" fill="#1C2333">• Annual contract → hourly rate</text><text x="645" y="654" font-size="17" fill="#1C2333">• Weighted required TPM</text><text x="645" y="692" font-size="17" fill="#1C2333">• Capacity / utilization check</text><text x="645" y="730" font-size="17" fill="#1C2333">• Viability + savings verdict</text>
<rect x="1070" y="490" width="380" height="280" rx="18" fill="#FBEAE8" stroke="#B7432D" stroke-width="3"/><text x="1260" y="532" text-anchor="middle" font-size="22" font-weight="700" fill="#12193F">Reference Data</text><text x="1105" y="578" font-size="17" fill="#1C2333">• 31 LLM + 6 image models</text><text x="1105" y="616" font-size="17" fill="#1C2333">• 37 insurance use cases</text><text x="1105" y="654" font-size="17" fill="#1C2333">• Benchmarks + PAYG flags</text><text x="1105" y="692" font-size="17" fill="#1C2333">• Pricing / context / modalities</text><text x="1105" y="730" font-size="17" fill="#1C2333">• PTU planning defaults</text>
</g>
